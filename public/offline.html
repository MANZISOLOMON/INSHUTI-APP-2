<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • Found IN - Your Secure Recovery Solution</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F8FAF7;
      color: #1A201C;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E5E9E4;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      margin: 20px;
    }
    .icon {
      width: 56px;
      height: 56px;
      background: #EBF3EF;
      color: #1B4D3E;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 10px;
    }
    p {
      font-size: 13px;
      color: #65736B;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background: #1B4D3E;
      color: #FFFFFF;
      padding: 12px 28px;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #153D31;
    }
    .tag {
      display: inline-block;
      margin-top: 16px;
      font-size: 11px;
      color: #92400E;
      background: #FEF3C7;
      padding: 4px 12px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
      </svg>
    </div>
    <h1>You are Currently Offline</h1>
    <p>
      The Found IN platform requires an active internet connection to query secure databases, verify ownership, and lock escrow. Please check your cellular data or Wi-Fi.
    </p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <br>
    <span class="tag">SMS Alerts are still active via cellular network</span>
  </div>
</body>
</html>
